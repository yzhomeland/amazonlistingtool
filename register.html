<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册账号 | 亚马逊Listing智能优化</title>
<style>
  :root {
    --orange: #FF9900; --dark: #232F3E; --light: #F5F5F5;
    --white: #FFFFFF; --text: #333333; --sub: #666666; --border: #E0E0E0;
    --green: #4CAF50; --red: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--light); line-height: 1.7;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .topnav { background: var(--dark); }
  .topnav .nav-inner {
    max-width: 960px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: center; height: 50px; justify-content: space-between;
  }
  .topnav .brand { color: white; font-weight: 700; text-decoration: none; font-size: 1em; }
  .topnav .nav-links { display: flex; gap: 24px; align-items: center; }
  .topnav .nav-links a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.9em; }
  .topnav .nav-links a:hover { color: var(--orange); }

  .main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .register-box {
    background: white; border-radius: 14px; padding: 44px 36px;
    width: 440px; max-width: 95vw; box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  }
  .register-box h2 { text-align: center; font-size: 1.5em; margin-bottom: 4px; }
  .register-box .sub { text-align: center; color: var(--sub); font-size: 0.9em; margin-bottom: 28px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-weight: 600; font-size: 0.9em; margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.95em; outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--orange); }
  .form-group .hint { font-size: 0.78em; color: #999; margin-top: 4px; }
  .form-group .error { font-size: 0.82em; color: var(--red); margin-top: 4px; display: none; }
  .form-group .error.show { display: block; }

  .btn {
    width: 100%; padding: 13px; border-radius: 8px; border: none;
    font-size: 1.05em; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: var(--orange); color: #000; }
  .btn-primary:hover { background: #e88a00; }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

  .divider { text-align: center; color: #999; margin: 20px 0; font-size: 0.85em; position: relative; }
  .divider::before, .divider::after {
    content: ""; position: absolute; top: 50%; width: 40%;
    border-top: 1px solid var(--border);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }

  .login-link { text-align: center; font-size: 0.9em; color: var(--sub); }
  .login-link a { color: var(--orange); text-decoration: none; font-weight: 600; }
  .login-link a:hover { text-decoration: underline; }

  .benefits {
    background: #FFF8E1; border-radius: 8px; padding: 16px; margin-bottom: 20px; font-size: 0.85em;
  }
  .benefits h4 { margin-bottom: 6px; }
  .benefits ul { list-style: none; }
  .benefits ul li::before { content: "✓ "; color: var(--green); font-weight: 700; }

  footer { text-align: center; padding: 20px; color: #999; font-size: 0.82em; }

  @media (max-width: 500px) {
    .register-box { padding: 28px 20px; }
  }
</style>
</head>
<body>

<header class="topnav">
  <div class="nav-inner">
    <a href="index.html" class="brand">Listing 智能优化</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="about.html">关于我</a>
    </div>
  </div>
</header>

<div class="main">
  <div class="register-box">
    <h2>📝 注册账号</h2>
    <p class="sub">注册后即可开通会员，解锁 AI 优化操作台</p>

    <div class="benefits">
      <h4>🎁 注册福利</h4>
      <ul>
        <li>24小时免费试用（可使用1次标题优化）</li>
        <li>开通月度会员仅需 ¥79/月</li>
        <li>付款后可立即激活解锁全部功能</li>
      </ul>
    </div>

    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="regUser" placeholder="4-20位字母或数字" maxlength="20" autocomplete="username">
      <div class="error" id="errUser">用户名长度为4-20位，仅支持字母和数字</div>
    </div>

    <div class="form-group">
      <label>密码</label>
      <input type="password" id="regPass" placeholder="至少6位" maxlength="30" autocomplete="new-password">
      <div class="error" id="errPass">密码至少6位</div>
    </div>

    <div class="form-group">
      <label>确认密码</label>
      <input type="password" id="regPass2" placeholder="再次输入密码" maxlength="30" autocomplete="new-password">
      <div class="error" id="errPass2">两次密码不一致</div>
    </div>

    <div class="form-group">
      <label>微信/联系方式 <span style="color:#999;font-weight:400;">（选填，方便售后联系）</span></label>
      <input type="text" id="regContact" placeholder="你的微信号或手机号" maxlength="50">
    </div>

    <button class="btn btn-primary" onclick="doRegister()" id="btnReg">注册账号</button>

    <div class="divider">已有账号？</div>

    <p class="login-link">已有账号？<a href="dashboard.html">直接登录操作台</a></p>
    <p class="login-link" style="margin-top:8px;">需要开通会员？<a href="membership.html">去开通 →</a></p>
  </div>
</div>

<footer>
  <p>联系微信：young_yzd | 邮箱：253582669@qq.com</p>
</footer>

<script>
// ============================================
// ⚠️ 部署后把下面这行换成你的 Worker 地址
// ============================================
const API_BASE = 'https://amz-listing-api.a253582669.workers.dev';

async function doRegister() {
  const user = document.getElementById('regUser').value.trim();
  const pass = document.getElementById('regPass').value.trim();
  const pass2 = document.getElementById('regPass2').value.trim();
  const contact = document.getElementById('regContact').value.trim();

  // Validation
  let valid = true;
  const userRe = /^[a-zA-Z0-9]{4,20}$/;
  if (!userRe.test(user)) {
    document.getElementById('errUser').classList.add('show');
    valid = false;
  } else {
    document.getElementById('errUser').classList.remove('show');
  }

  if (pass.length < 6) {
    document.getElementById('errPass').classList.add('show');
    valid = false;
  } else {
    document.getElementById('errPass').classList.remove('show');
  }

  if (pass !== pass2) {
    document.getElementById('errPass2').classList.add('show');
    valid = false;
  } else {
    document.getElementById('errPass2').classList.remove('show');
  }

  if (!valid) return;

  // 调用 API 注册
  const btn = document.getElementById('btnReg');
  btn.disabled = true;
  btn.textContent = '注册中...';

  try {
    const resp = await fetch(API_BASE + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass, contact })
    });
    const data = await resp.json();

    if (!data.success) {
      alert(data.error || '注册失败，请重试');
      btn.disabled = false;
      btn.textContent = '注册账号';
      return;
    }

    // 保存登录状态到本地
    localStorage.setItem('amz_current_user', user);
    localStorage.setItem('amz_logged_in', '1');
    localStorage.setItem('amz_sub_until', data.user.subscriptionUntil);

    alert('注册成功！🎉\n\n你已获得24小时免费试用。\n开通月度会员即可解锁全部功能。\n\n点击确定前往会员开通页面。');
    window.location.href = 'membership.html';

  } catch (err) {
    alert('网络错误：' + err.message + '\n\n请检查网络连接后重试');
    btn.disabled = false;
    btn.textContent = '注册账号';
  }
}
</script>

</body>
</html>
