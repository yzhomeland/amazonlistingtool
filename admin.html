<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 | 激活码生成</title>
<style>
  :root {
    --orange: #FF9900; --dark: #232F3E; --light: #F5F5F5;
    --white: #FFFFFF; --text: #333333; --sub: #666666; --border: #E0E0E0;
    --green: #4CAF50; --red: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--light); line-height: 1.7;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .topbar {
    background: var(--dark); color: white;
    padding: 0 24px; height: 50px; display: flex; align-items: center;
    justify-content: space-between; font-weight: 700;
  }
  .topbar .logout { color: rgba(255,255,255,0.6); cursor: pointer; font-size: 0.88em; font-weight: 400; }
  .topbar .logout:hover { color: white; }

  .main { flex: 1; max-width: 720px; margin: 0 auto; padding: 36px 20px; width: 100%; }
  .card {
    background: white; border-radius: 12px; padding: 32px;
    margin-bottom: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .card h3 { font-size: 1.15em; margin-bottom: 4px; }
  .card .sub { color: var(--sub); font-size: 0.85em; margin-bottom: 20px; }

  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-weight: 600; font-size: 0.9em; margin-bottom: 6px; }
  .form-row input, .form-row select {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
    border-radius: 6px; font-size: 0.93em; outline: none;
  }
  .form-row input:focus { border-color: var(--orange); }
  .row-2 { display: flex; gap: 14px; }
  .row-2 .form-row { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 28px; border-radius: 6px; border: none;
    font-size: 0.95em; font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: var(--orange); color: #000; }
  .btn-primary:hover { background: #e88a00; }
  .btn-copy { background: var(--dark); color: white; }
  .btn-copy:hover { background: #37475A; }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { background: #c0392b; }

  .result {
    background: #E8F5E9; border: 2px solid var(--green); border-radius: 10px;
    padding: 24px; text-align: center; margin-top: 18px; display: none;
  }
  .result.show { display: block; }
  .result .code {
    font-size: 1.8em; font-weight: 800; letter-spacing: 2px;
    color: var(--dark); margin: 10px 0; font-family: monospace;
  }
  .result .info { font-size: 0.85em; color: var(--sub); }

  .user-list { font-size: 0.9em; }
  .user-list table { width: 100%; border-collapse: collapse; }
  .user-list th, .user-list td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .user-list th { background: #f5f5f5; font-size: 0.85em; }
  .user-list .expired { color: var(--red); }
  .user-list .active { color: var(--green); }

  .login-box {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  .login-box .inner {
    background: white; border-radius: 12px; padding: 32px 28px;
    width: 360px; max-width: 90vw; text-align: center;
  }
  .login-box input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 6px; font-size: 1em; margin-bottom: 12px; }

  @media (max-width: 500px) {
    .card { padding: 20px 16px; }
    .result .code { font-size: 1.2em; }
  }
</style>
</head>
<body>

<!-- Admin Login -->
<div class="login-box" id="adminLogin">
  <div class="inner">
    <h3>🔐 管理员登录</h3>
    <p style="color:var(--sub);font-size:0.88em;margin-bottom:18px;">仅限管理员使用</p>
    <input type="password" id="adminPass" placeholder="管理员密码">
    <button class="btn btn-primary" style="width:100%" onclick="adminLogin()">登录</button>
  </div>
</div>

<div class="topbar">
  <span>⚙ 管理后台 — 激活码生成</span>
  <span class="logout" onclick="adminLogout()">退出</span>
</div>

<div class="main">

  <!-- Generate Code -->
  <div class="card">
    <h3>🎫 生成激活码</h3>
    <p class="sub">用户付款后，根据其购买的套餐生成对应天数的激活码，发给用户即可</p>

    <div class="row-2">
      <div class="form-row">
        <label>套餐类型</label>
        <select id="planType" onchange="updateDays()">
          <option value="30">月度会员 — 30天 — ¥79</option>
          <option value="1">单次优化 — 1天 — ¥29</option>
          <option value="90">季度会员 — 90天 — ¥199</option>
          <option value="0">自定义天数</option>
        </select>
      </div>
      <div class="form-row">
        <label>自定义天数</label>
        <input type="number" id="customDays" value="30" min="1" max="365" onchange="document.getElementById('planType').value='0'">
      </div>
    </div>

    <div class="form-row">
      <label>用户备注 <span style="color:#999;font-weight:400;">（方便你记录是谁买的，选填）</span></label>
      <input type="text" id="userNote" placeholder="例如：微信名XXX，购买了月度会员">
    </div>

    <button class="btn btn-primary" onclick="generateCode()">🔑 生成激活码</button>

    <div class="result" id="genResult">
      <p style="font-weight:700;">✅ 激活码已生成</p>
      <div class="code" id="genCode"></div>
      <p class="info">有效期至：<strong id="genExpiry"></strong>（<span id="genDays"></span>天）</p>
      <p class="info" id="genNote" style="margin-top:4px;"></p>
      <button class="btn btn-copy" style="margin-top:14px;" onclick="copyCode()">📋 复制激活码发给用户</button>
    </div>
  </div>

  <!-- History -->
  <div class="card">
    <h3>📋 最近生成的激活码</h3>
    <p class="sub">最近20条记录（仅存储在本浏览器）</p>
    <div class="user-list" id="codeHistory">
      <p style="color:var(--sub);">暂无记录</p>
    </div>
    <button class="btn btn-danger" style="margin-top:14px;font-size:0.85em;" onclick="clearHistory()">清空历史记录</button>
  </div>

  <!-- Registered Users -->
  <div class="card">
    <h3>👥 已注册用户</h3>
    <p class="sub">查看所有注册用户及其订阅状态</p>
    <div class="user-list" id="userList">
      <p style="color:var(--sub);">暂无注册用户</p>
    </div>
  </div>

</div>

<script>
const ADMIN_PASS = 'young2025';
const SECRET_SALT = 'amz_op2025_secret_key';

// ============ ADMIN LOGIN ============
function adminLogin() {
  const pass = document.getElementById('adminPass').value.trim();
  if (pass !== ADMIN_PASS) {
    alert('密码错误');
    return;
  }
  document.getElementById('adminLogin').style.display = 'none';
  renderHistory();
  renderUsers();
}

function adminLogout() {
  document.getElementById('adminLogin').style.display = 'flex';
}

// ============ GENERATE CODE ============
function updateDays() {
  const plan = document.getElementById('planType').value;
  if (plan !== '0') {
    document.getElementById('customDays').value = plan;
  }
}

function generateCode() {
  const planType = document.getElementById('planType').value;
  const customDays = parseInt(document.getElementById('customDays').value) || 30;
  const days = planType === '0' ? customDays : parseInt(planType);
  const userNote = document.getElementById('userNote').value.trim();

  if (days < 1 || days > 365) {
    alert('天数范围：1-365');
    return;
  }

  const expiryDate = new Date(Date.now() + days * 24 * 60 * 60 * 1000);
  const expiryISO = expiryDate.toISOString();

  // Simple activation code: base64(expiryISO + "|" + salt)
  const payload = expiryISO + '|' + SECRET_SALT;
  const code = 'AMZ-' + btoa(payload);

  // Display
  document.getElementById('genCode').textContent = code;
  document.getElementById('genExpiry').textContent = expiryDate.toLocaleString('zh-CN');
  document.getElementById('genDays').textContent = days;
  document.getElementById('genNote').textContent = userNote ? '备注：' + userNote : '';
  document.getElementById('genResult').classList.add('show');

  // Save to history
  saveHistory({ code, days, expiry: expiryISO, note: userNote, createdAt: new Date().toISOString() });
  renderHistory();
}

function copyCode() {
  const code = document.getElementById('genCode').textContent;
  navigator.clipboard.writeText(code).then(() => alert('激活码已复制！\n\n直接粘贴发给用户即可。')).catch(() => alert('复制失败，请手动选中激活码复制。'));
}

// ============ HISTORY ============
function saveHistory(entry) {
  const history = JSON.parse(localStorage.getItem('amz_code_history') || '[]');
  history.unshift(entry);
  if (history.length > 20) history.length = 20;
  localStorage.setItem('amz_code_history', JSON.stringify(history));
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('amz_code_history') || '[]');
  const container = document.getElementById('codeHistory');
  if (history.length === 0) {
    container.innerHTML = '<p style="color:var(--sub);">暂无记录</p>';
    return;
  }
  container.innerHTML = '<table><tr><th>激活码</th><th>天数</th><th>有效期至</th><th>备注</th><th>生成时间</th></tr>' +
    history.map(h => {
      const shortCode = h.code.substring(0, 20) + '...';
      return `<tr>
        <td style="font-family:monospace;font-size:0.82em;">${shortCode}</td>
        <td>${h.days}天</td>
        <td>${new Date(h.expiry).toLocaleDateString('zh-CN')}</td>
        <td>${h.note || '-'}</td>
        <td style="font-size:0.82em;">${new Date(h.createdAt).toLocaleString('zh-CN')}</td>
      </tr>`;
    }).join('') + '</table>';
}

function clearHistory() {
  if (confirm('确定清空所有激活码生成记录？')) {
    localStorage.removeItem('amz_code_history');
    renderHistory();
  }
}

// ============ USERS ============
function renderUsers() {
  const users = JSON.parse(localStorage.getItem('amz_users') || '{}');
  const container = document.getElementById('userList');
  const entries = Object.entries(users);

  if (entries.length === 0) {
    container.innerHTML = '<p style="color:var(--sub);">暂无注册用户</p>';
    return;
  }

  container.innerHTML = '<table><tr><th>用户名</th><th>联系方式</th><th>注册时间</th><th>订阅到期</th><th>状态</th></tr>' +
    entries.map(([user, data]) => {
      const now = new Date();
      const subUntil = new Date(data.subscriptionUntil || 0);
      const expired = subUntil < now;
      const status = expired ? '<span class="expired">已过期</span>' : '<span class="active">有效</span>';
      const expiryStr = data.subscriptionUntil ? subUntil.toLocaleDateString('zh-CN') : '试用中';
      const regDate = data.registeredAt ? new Date(data.registeredAt).toLocaleDateString('zh-CN') : '-';
      return `<tr>
        <td><strong>${user}</strong></td>
        <td>${data.contact || '-'}</td>
        <td>${regDate}</td>
        <td>${expiryStr}</td>
        <td>${status}</td>
      </tr>`;
    }).join('') + '</table>';
}

// Init
updateDays();
</script>

</body>
</html>
